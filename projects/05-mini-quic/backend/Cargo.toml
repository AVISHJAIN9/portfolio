[package]
name = "mini-quic"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.6"
thiserror = "1.0"
rand = "0.8"
blake3 = "1.5"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# Monorepo Platform Crates
pf-bytes = { path = "../../../platform/rust/crates/pf-bytes" }
pf-checksum = { path = "../../../platform/rust/crates/pf-checksum" }
pf-collections = { path = "../../../platform/rust/crates/pf-collections" }
pf-cache = { path = "../../../platform/rust/crates/pf-cache" }
pf-sync = { path = "../../../platform/rust/crates/pf-sync" }
pf-time = { path = "../../../platform/rust/crates/pf-time" }
pf-sim = { path = "../../../platform/rust/crates/pf-sim" }
pf-crypto = { path = "../../../platform/rust/crates/pf-crypto" }
pf-ratelimit = { path = "../../../platform/rust/crates/pf-ratelimit" }
pf-metrics = { path = "../../../platform/rust/crates/pf-metrics" }
pf-http = { path = "../../../platform/rust/crates/pf-http" }
pf-errors = { path = "../../../platform/rust/crates/pf-errors" }
pf-testkit = { path = "../../../platform/rust/crates/pf-testkit" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "quic_bench"
harness = false
