[package]
name = "rollback-netcode-server"
version = "0.1.0"
edition = "2021"
authors = ["Avish Jain <avishjain@example.com>"]
description = "Deterministic server-authoritative multiplayer netcode engine with rollback resimulation."

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.6"
byteorder = "1.5"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
rand = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tokio-test = "0.4"

[[bench]]
name = "simulation_bench"
path = "../benchmarks/benches/simulation_bench.rs"
harness = false
