name: Benchmarks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  benchmark-matrix:
    name: Benchmark Matrix (${{ matrix.project }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        project:
          - "04-columnar-query-engine"
          - "05-mini-quic"
          - "06-lsm-kv-engine"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pyarrow openpyxl

      - name: Run Project Benchmark
        run: |
          cargo bench --manifest-path projects/${{ matrix.project }}/backend/Cargo.toml --no-run || true

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ matrix.project }}-${{ matrix.os }}
          path: evidence/
          if-no-files-found: ignore
