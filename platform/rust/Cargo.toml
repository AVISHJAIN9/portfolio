[workspace]
resolver = "2"
members = [
    "crates/pf-bytes",
    "crates/pf-checksum",
    "crates/pf-collections",
    "crates/pf-cache",
    "crates/pf-sync",
    "crates/pf-time",
    "crates/pf-sim",
    "crates/pf-wal",
    "crates/pf-storage-kit",
    "crates/pf-net",
    "crates/pf-crypto",
    "crates/pf-ratelimit",
    "crates/pf-hashring",
    "crates/pf-metrics",
    "crates/pf-http",
    "crates/pf-vector-kit",
    "crates/pf-testkit",
    "crates/pf-config",
    "crates/pf-errors"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Avish Jain <avishjain@example.com>"]
license = "Apache-2.0"
repository = "https://github.com/AVISHJAIN9/portfolio-forge"

[workspace.dependencies]
bytes = "1.6"
byteorder = "1.5"
tokio = { version = "1.38", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"
rand_xoshiro = "0.6"
blake3 = "1.5"
crc32fast = "1.4"
twox-hash = "1.6"
hdrhistogram = "7.5"
proptest = "1.4"
criterion = "0.5"
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
